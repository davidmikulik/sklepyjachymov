<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interaktivní půdorys a vizualizace sklepních prostor č.p. 885 v Jáchymově včetně návrhu cílového stavu, elektroinstalace a prohlášení vlastníka.">
    <meta name="keywords" content="sklep, Jáchymov, půdorys, vizualizace, elektroinstalace, kóje, 885, prohlášení vlastníka">
    <meta name="author" content="Sklep Jáchymov">
    <meta name="robots" content="index, follow">
    <title>Sklep Jáchymov – Přesný Půdorys & Vizualizace + Elektro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 5px; color: #2c3e50; font-size: 22px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 15px; text-align: center; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            background: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            align-items: center;
            justify-content: center;
        }

        .btn-layer {
            border: 1px solid #ccc;
            background: #f8f9fa;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .btn-layer.active {
            background-color: #1565c0;
            color: white;
            border-color: #1565c0;
        }

        .btn-layer-doc.active {
            background-color: #d84315 !important;
            color: white !important;
            border-color: #bf360c !important;
        }

        .btn-layer-proposal.active {
            background-color: #0288d1 !important;
            color: white !important;
            border-color: #0288d1 !important;
        }

        .btn-layer-proposal2.active {
            background-color: #00897b !important;
            color: white !important;
            border-color: #00897b !important;
        }

        .btn-layer-usage.active {
            background-color: #7b1fa2 !important;
            color: white !important;
            border-color: #7b1fa2 !important;
        }

        .btn-layer-vis.active {
            background-color: #37474f !important;
            color: white !important;
            border-color: #263238 !important;
        }

        .btn-layer-vis2.active {
            background-color: #1565c0 !important;
            color: white !important;
            border-color: #0d47a1 !important;
        }

        .btn-layer-elec.active {
            background-color: #f57c00 !important;
            color: white !important;
            border-color: #e65100 !important;
        }

        .btn-dim-toggle {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .btn-dim-toggle.active {
            background-color: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1300px;
            width: 100%;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .map-container {
            flex: 3;
            min-width: 340px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background-color: #fafafa;
            overflow: hidden;
            position: relative;
        }

        svg { width: 100%; height: auto; display: block; }

        /* Vrstva 1: Fyzický stav */
        .working-room {
            fill: #e3f2fd;
            fill-opacity: 0.75;
            stroke: #1565c0;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.2s;
        }
        .working-room:hover { fill: #bbdefb; }

        .unusable-room {
            fill: #cfd8dc;
            fill-opacity: 0.8;
            stroke: #78909c;
            stroke-width: 2;
            cursor: pointer;
        }
        .unusable-room:hover { fill: #b0bec5; }

        .corridor-work { fill: #f5f5f5; stroke: #616161; stroke-width: 1.5; cursor: pointer; }
        .corridor-work:hover { fill: #e0e0e0; }
        .stairs-work { fill: #ffe0b2; stroke: #e65100; stroke-width: 1.5; cursor: pointer; }

        /* Vrstva 2: Oficiální stav */
        .official-unit {
            fill: #ffecb3;
            fill-opacity: 0.65;
            stroke: #d84315;
            stroke-width: 2.5;
            stroke-dasharray: 6 3;
            cursor: pointer;
        }
        .official-unit:hover { fill-opacity: 0.85; }

        /* Vrstva 4: Návrhové jednotky */
        .proposed-unit {
            fill: #29b6f6;
            fill-opacity: 0.85;
            stroke: #0277bd;
            stroke-width: 2.5;
            cursor: pointer;
            transition: all 0.2s;
        }
        .proposed-unit:hover { fill: #4fc3f7; fill-opacity: 0.95; }
        .door-proposal { cursor: pointer; }
        .door-gap { fill: #ffffff; stroke: none; }
        .door-leaf { stroke: #0d47a1; stroke-width: 2.5; stroke-linecap: round; }
        .door-swing { fill: #0d47a1; fill-opacity: 0.12; stroke: #0d47a1; stroke-width: 1; stroke-dasharray: 3 2; }
        .door-proposal:hover .door-leaf, .door-proposal:hover .door-swing { stroke: #e65100; }

        /* Vrstva 3: Aktuální využití */
        .usage-room {
            fill: #f3e5f5;
            fill-opacity: 0.85;
            stroke: #7b1fa2;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.2s;
        }
        .usage-room:hover { fill: #e1bee7; }

        /* Vizualizace dělících kójí */
        .cage-wall { fill: url(#block-pattern); stroke: #424242; stroke-width: 1; }
        .cage-frame { stroke: #212121; stroke-width: 3; fill: none; }
        .cage-door { fill: #37474f; fill-opacity: 0.4; stroke: #102a43; stroke-width: 2; cursor: pointer; }
        .cage-door:hover { fill: #455a64; fill-opacity: 0.7; }

        /* Vizualizace kójí 2 */
        .v2-unit { fill: #bbdefb; stroke: none; cursor: pointer; transition: fill 0.2s; }
        .v2-unit:hover { fill: #90caf9; }
        .v2-shared { fill: #c8e6c9; stroke: none; cursor: pointer; }
        .v2-shared:hover { fill: #a5d6a7; }
        .v2-corridor { fill: #f5f5f0; stroke: none; cursor: pointer; }
        .v2-corridor:hover { fill: #ebebe0; }
        .v2-out { fill: url(#v2-hatch); stroke: none; cursor: pointer; }
        .v2-stairs { fill: #ffe0b2; stroke: none; cursor: pointer; }
        .v2-tread { stroke: #ffb74d; stroke-width: 1; pointer-events: none; }
        .v2-wall { fill: none; stroke: #37474f; stroke-width: 2.5; pointer-events: none; }
        .v2-outer { fill: none; stroke: #263238; stroke-width: 6; pointer-events: none; }
        .v2-wall-legend { stroke: #37474f; stroke-width: 3; }
        .v2-partition { fill: url(#block-pattern); stroke: #455a64; stroke-width: 0.6; }
        .v2-door { cursor: pointer; }
        .v2-door-gap { fill: #f5f5f0; stroke: none; }
        .v2-opening { fill: #f5f5f0; stroke: none; pointer-events: none; }
        .v2-arrow { fill: none; stroke: #1565c0; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .v2-jamb { stroke: #37474f; stroke-width: 2.5; }
        .v2-door-leaf { stroke: #6d4c41; stroke-width: 3; stroke-linecap: round; }
        .v2-door-swing { fill: #8d6e63; fill-opacity: 0.12; stroke: #8d6e63; stroke-width: 1; stroke-dasharray: 3 2; }
        .v2-door:hover .v2-door-leaf { stroke: #e65100; }
        .v2-num { font-size: 14px; font-weight: bold; fill: #0d47a1; text-anchor: middle; pointer-events: none; }
        .v2-num-s { font-size: 12px; }
        .v2-dim { font-size: 9.5px; fill: #1565c0; text-anchor: middle; pointer-events: none; }
        .v2-area { font-size: 9.5px; font-weight: bold; fill: #1565c0; text-anchor: middle; pointer-events: none; }
        .v2-out-label { font-size: 12px; font-weight: bold; fill: #78909c; text-anchor: middle; pointer-events: none; }
        .v2-out-sub { font-size: 10px; fill: #90a4ae; text-anchor: middle; pointer-events: none; }
        .v2-corr-label { font-size: 12px; font-weight: bold; fill: #8d8d80; text-anchor: middle; letter-spacing: 1px; pointer-events: none; }
        .v2-corr-sub { font-size: 9px; fill: #9e9e90; text-anchor: middle; pointer-events: none; }
        .v2-legend { font-size: 11px; fill: #37474f; }

        /* Elektroprvky styling */
        .elec-light { fill: #ffd54f; stroke: #f57f17; stroke-width: 1.5; cursor: pointer; filter: drop-shadow(0px 0px 3px #ffeb3b); }
        .elec-light:hover { fill: #ffff8d; transform: scale(1.15); transform-origin: center; }
        .elec-socket { fill: #00e676; stroke: #1b5e20; stroke-width: 1.5; cursor: pointer; }
        .elec-socket:hover { fill: #69f0ae; }
        .elec-line { stroke: #ff9800; stroke-width: 1.5; stroke-dasharray: 4 2; }

        /* Vrstva Kóty a Rozměry */
        .dim-line { stroke: #d32f2f; stroke-width: 1.5; marker-end: url(#arrow-end); marker-start: url(#arrow-start); }
        .dim-line-outer { stroke: #2e7d32; stroke-width: 2; marker-end: url(#arrow-end-green); marker-start: url(#arrow-start-green); }
        .dim-text { font-size: 11px; font-weight: bold; fill: #c62828; text-anchor: middle; dominant-baseline: middle; }
        .dim-text-outer { font-size: 13px; font-weight: bold; fill: #1b5e20; text-anchor: middle; dominant-baseline: middle; }
        .dim-guide { stroke: #9e9e9e; stroke-width: 1; stroke-dasharray: 3 3; }

        .label-title { font-size: 12px; font-weight: bold; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
        .label-sub { font-size: 10px; fill: #555; pointer-events: none; text-anchor: middle; }

        .info-panel {
            flex: 1;
            min-width: 260px;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 15px;
        }

        .info-panel h3 { margin-top: 0; color: #1565c0; border-bottom: 2px solid #1565c0; padding-bottom: 6px; }
        .info-row { margin-bottom: 10px; }
        .info-label { font-size: 12px; font-weight: bold; color: #666; display: block; }
        .info-val { font-size: 15px; color: #111; font-weight: 500; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #fff; }
        .badge-official { background-color: #d84315; }
        .badge-working { background-color: #1565c0; }
        .badge-proposal { background-color: #0288d1; }
        .badge-proposal2 { background-color: #00897b; }
        .badge-vis2 { background-color: #1565c0; }
        .badge-usage { background-color: #7b1fa2; }
        .badge-vis { background-color: #37474f; }
        .badge-elec { background-color: #f57c00; }
        .badge-unusable { background-color: #78909c; }

        .img-uploader {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.9);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #d84315;
            z-index: 100;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .joke-box {
            display: block;
            margin-top: 16px;
            padding: 14px 16px;
            border: 1px solid #cfd8dc;
            border-radius: 10px;
            background: #f7fbff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            max-width: 1300px;
            width: 100%;
        }

        .joke-box-title {
            margin: 0 0 10px;
            font-size: 14px;
            font-weight: 700;
            color: #1565c0;
        }

        .joke-box-text {
            margin: 0;
            color: #263238;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <h1>1.PP č.p. 885, Jáchymov – Přesný Půdorys</h1>
    <p class="subtitle">Interaktivní mapa prostor, umožňuje procházet a zobrazovat různé vrstvy informací</p>

    <!-- OVLÁDACÍ TLAČÍTKA -->
    <div class="controls">
        <button class="btn-layer active" onclick="setLayerMode('working')">🏢 Fyzické místnosti (A/B/V)</button>
        <button class="btn-layer" onclick="setLayerMode('both')">🔗 Fyzický + Oficiální</button>
        <button class="btn-layer btn-layer-usage" onclick="setLayerMode('usage')">👤 Aktuální využití</button>
        <button class="btn-layer btn-layer-proposal" onclick="setLayerMode('proposal')">🎯 Návrh cílového stavu </button>
        <button class="btn-layer btn-layer-proposal2" onclick="setLayerMode('proposal2')">🎯 Návrh cílového stavu 2</button>
        <button class="btn-layer btn-layer-elec" onclick="setLayerMode('electric')">⚡ Elektroinstalace (Cílový stav)</button>
        <button class="btn-layer btn-layer-vis" onclick="setLayerMode('visualization')">🎨 Vizualizace kójí</button>
        <button class="btn-layer btn-layer-vis2" onclick="setLayerMode('visualization2')">🎨 Vizualizace kójí 2</button>
        <button class="btn-layer btn-layer-doc" onclick="setLayerMode('doc')">📜 Prohlášení vlastníka</button>
        <button class="btn-layer" onclick="setLayerMode('official')">📜 Oficiální stav (bez fyzického)</button>
        <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 5px;"></span>
        <button class="btn-layer btn-dim-toggle" id="btn-dim" onclick="toggleDimensions()">📐 Vrstva rozměrů (Vypnuta)</button>
    </div>

    <div class="container">
        <div class="map-container">
            <div id="uploader-box" class="img-uploader">
                <b>Podkladový sken:</b>
                <input type="file" id="file-input" accept="image/*" onchange="loadCustomImage(event)" style="font-size:11px;">
            </div>

            <svg viewBox="0 0 1100 560" id="main-svg">
                <defs>
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="1"></path>
                    </pattern>

                    <pattern id="block-pattern" width="16" height="12" patternUnits="userSpaceOnUse">
                        <rect width="16" height="12" fill="#b0bec5"></rect>
                        <rect x="0" y="0" width="15" height="5" fill="#cfd8dc" stroke="#90a4ae" stroke-width="0.5"></rect>
                        <rect x="0" y="6" width="7" height="5" fill="#cfd8dc" stroke="#90a4ae" stroke-width="0.5"></rect>
                        <rect x="8" y="6" width="7" height="5" fill="#cfd8dc" stroke="#90a4ae" stroke-width="0.5"></rect>
                    </pattern>

                    <marker id="arrow-start" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 10 0 L 0 5 L 10 10 z" fill="#d32f2f"></path>
                    </marker>
                    <marker id="arrow-end" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"></path>
                    </marker>
                    <marker id="arrow-start-green" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 10 0 L 0 5 L 10 10 z" fill="#2e7d32"></path>
                    </marker>
                    <marker id="arrow-end-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"></path>
                    </marker>
                    <pattern id="v2-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                        <rect width="8" height="8" fill="#eceff1"></rect>
                        <line x1="0" y1="0" x2="0" y2="8" stroke="#cfd8dc" stroke-width="3"></line>
                    </pattern>
                    <filter id="v2-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="1.2" dy="1.6" stdDeviation="1" flood-color="#263238" flood-opacity="0.45"></feDropShadow>
                    </filter>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid)"></rect>

                <!-- VRSTVA 0: OBRÁZEK Z PROHLÁŠENÍ VLASTNÍKA -->
                <g id="layer-doc" style="display: none;">
                    <image id="doc-image" href="sklepyzprohlasenivlastnika.png " x="80" y="70" width="940" height="420" opacity="0.85" preserveAspectRatio="none" onerror="handleImageError(this)" onclick="window.open('https://drive.google.com/uc?export=view&id=1EJGbXu_3tZ3E7xuVpOS0kPoH5D7D6bfz', '_blank')" style="cursor: pointer;"/>
                </g>

                <!-- VRSTVA 1: FYZICKÉ MÍSTNOSTI -->
                <g id="layer-working" style="display: block;">
                    <rect x="90" y="80" width="240" height="132" class="working-room" onclick="selectItem('working', 'A1', 'Fyzická místnost A1', '6,00 x 3,30 m (19,80 m²)', 'Místnost s kójemi 885/1, 885/2, 885/6')"></rect>
                    <text x="210" y="185" class="label-title">A1 (6,0 × 3,3 m)</text>

                    <rect x="330" y="80" width="140" height="132" class="working-room" onclick="selectItem('working', 'A2', 'Fyzická místnost A2', '3,50 x 3,30 m (11,55 m²)', 'Místnost s kójemi 885/8 a 885/9')"></rect>
                    <text x="400" y="185" class="label-title">A2 (3,5 × 3,3 m)</text>

                    <rect x="470" y="80" width="80" height="132" class="stairs-work" onclick="selectItem('working', 'S1', 'Vstupní schodiště', '2,00 x 3,30 m', 'Schody')"></rect>
                    <text x="510" y="146" class="label-title" fill="#e65100">SCHODY</text>

                    <rect x="550" y="80" width="60" height="132" class="working-room" onclick="selectItem('working', 'A3', 'Fyzická místnost A3', '1,50 x 3,30 m (4,95 m²)', 'Sklad')"></rect>
                    <text x="580" y="146" class="label-title" font-size="11px">A3 (1,5m)</text>

                    <rect x="610" y="80" width="104" height="132" class="working-room" onclick="selectItem('working', 'A4', 'Fyzická místnost A4', '2,60 x 3,30 m (8,58 m²)', 'Kóje 885/10')"></rect>
                    <text x="662" y="146" class="label-title">A4 (2,6 m)</text>

                    <rect x="714" y="80" width="60" height="132" class="corridor-work" onclick="selectItem('working', 'C2', 'Odbočka chodby', '1,50 x 3,30 m', 'Prodloužení chodby')"></rect>
                    <text x="744" y="146" class="label-sub" fill="#444" transform="rotate(-90 744 146)">CHODBA (1,5m)</text>

                    <rect x="774" y="80" width="240" height="132" class="working-room" onclick="selectItem('working', 'A5', 'Fyzická místnost A5', '6,00 x 3,30 m (19,80 m²)', 'Sklad / Kóje 885/7')"></rect>
                    <text x="894" y="146" class="label-title">A5 (6,0 × 3,3 m)</text>

                    <rect x="90" y="212" width="624" height="62.4" class="corridor-work" onclick="selectItem('working', 'C1 (Hlavní)', 'Hlavní chodba', '15,60 x 1,56 m', 'Páteřní chodba sklepů')"></rect>
                    <text x="402" y="243" class="label-title" fill="#555">SPOLEČNÁ CHODBA C1 (1,56 m)</text>

                    <rect x="714" y="212" width="60" height="62.4" class="corridor-work" onclick="selectItem('working', 'C1-Uzel', 'Spojovací uzel chodby', '1,50 x 1,56 m', 'Propojení chodby')"></rect>

                    <rect x="774" y="212" width="240" height="62.4" class="working-room" style="fill: #e8eaf6;" onclick="selectItem('working', 'B6', 'Fyzická místnost / Prostor B6', '6,00 x 1,56 m (9,36 m²)', 'Součást nebytové jednotky 885/12')"></rect>
                    <text x="894" y="243" class="label-title" fill="#3f51b5">B6 (6,0 × 1,56 m)</text>

                    <rect x="90" y="274.4" width="186" height="212" class="working-room" onclick="selectItem('working', 'B1', 'Fyzická místnost B1', '4,65 x 5,30 m (24,65 m²)', 'Nebytová jednotka 885/11')"></rect>
                    <text x="183" y="380" class="label-title">B1 (4,65 × 5,3 m)</text>

                    <rect x="276" y="274.4" width="220" height="212" class="working-room" onclick="selectItem('working', 'B2', 'Fyzická místnost B2', '5,50 x 5,30 m (29,15 m²)', 'Sklepní prostor pro kóje 885/4 a 885/5')"></rect>

                    <rect x="496" y="274.4" width="96" height="212" class="unusable-room" onclick="selectItem('unusable', 'V0', 'Nepoužitelný prostor', '2,40 x 5,30 m', 'Výsep pod schodištěm')"></rect>
                    <text x="544" y="370" class="label-title" fill="#455a64">V0</text>
                    <text x="544" y="390" class="label-sub" fill="#37474f" font-weight="bold">VÝSEP</text>

                    <rect x="592" y="274.4" width="96" height="212" class="working-room" onclick="selectItem('working', 'B3', 'Fyzická místnost B3', '2,40 x 5,30 m (12,72 m²)', 'Součást nb. j. 885/12')"></rect>
                    <text x="640" y="380" class="label-title">B3 (2,4m)</text>

                    <rect x="688" y="274.4" width="132" height="212" class="working-room" onclick="selectItem('working', 'B4', 'Fyzická místnost B4', '3,30 x 5,30 m (17,49 m²)', 'Součást nb. j. 885/12')"></rect>

                <p style="color: #777; font-size: 13px;">Klikněte na jakoukoliv část mapy nebo elektroinstalace pro zobrazení detailu a parametrů.</p>
            </div>
        </div>
    </div>

    <div class="joke-box" id="joke-box">
        <h3 class="joke-box-title">Něco o Jáchymově <button onclick="loadText()" style="background: none; border: none; cursor: pointer; font-size: 16px; padding: 0 0 0 8px;" title="Načíst nové">🔄</button></h3>
        <p class="joke-box-text" id="joke-text">Načítám text ze serveru…</p>
    </div>

    <script>
        let dimensionsVisible = false;

        function handleImageError(img) {
            console.warn("Lokální obrázek sklepyzprohlasenivlastnika.png nebyl nalezen. Používám záložní zobrazení.");
            document.getElementById('uploader-box').style.display = 'block';
            img.style.display = 'none';
            const layerDoc = document.getElementById('layer-doc');
            
            if (!document.getElementById('fallback-draw')) {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                g.setAttribute("id", "fallback-draw");
                g.innerHTML = `
                    <rect x="85" y="70" width="935" height="420" fill="#fff8e1" stroke="#d84315" stroke-width="3" stroke-dasharray="8 4" opacity="0.9"/>
                    <text x="550" y="250" font-size="20" font-weight="bold" fill="#d84315" text-anchor="middle">📜 SKEN Z PROHLÁŠENÍ VLASTNÍKA</text>
                    <text x="550" y="280" font-size="14" fill="#666" text-anchor="middle">Chybí soubor 'sklepyzprohlasenivlastnika.png' ve složce.</text>
                    <text x="550" y="300" font-size="13" fill="#1565c0" text-anchor="middle">Můžete jej nahrát tlačítkem vpravo nahoře.</text>
                `;
                layerDoc.appendChild(g);
            }
        }

        function loadCustomImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('doc-image');
                    img.setAttribute('href', e.target.result);
                    img.style.display = 'block';
                    const fallback = document.getElementById('fallback-draw');
                    if (fallback) fallback.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        function setLayerMode(mode) {
            document.querySelectorAll('.btn-layer:not(.btn-dim-toggle)').forEach(b => b.classList.remove('active'));
            
            if (event && event.target) {
                event.target.classList.add('active');
            }

            const layerDoc = document.getElementById('layer-doc');
            const layerWork = document.getElementById('layer-working');
            const layerOff = document.getElementById('layer-official');
            const layerProp = document.getElementById('layer-proposal');
            const layerProp2 = document.getElementById('layer-proposal2');
            const layerUsage = document.getElementById('layer-usage');
            const layerVis = document.getElementById('layer-vis');
            const layerVis2 = document.getElementById('layer-vis2');
            const layerElec = document.getElementById('layer-electric');
            const uploaderBox = document.getElementById('uploader-box');

            layerDoc.style.display = 'none';
            layerWork.style.display = 'none';
            layerOff.style.display = 'none';
            layerProp.style.display = 'none';
            layerProp2.style.display = 'none';
            layerUsage.style.display = 'none';
            layerVis.style.display = 'none';
            layerVis2.style.display = 'none';
            layerElec.style.display = 'none';
            uploaderBox.style.display = 'none';

            if (mode === 'doc') {
                layerDoc.style.display = 'block';
                layerWork.style.display = 'none';
                uploaderBox.style.display = 'block';
                selectItem('official', 'Prohlášení vlastníka', 'Podkladový výkres PV', '1.PP č.p. 885', 'Zobrazení originální přílohy z Katastru');
            } else if (mode === 'both') {
                layerWork.style.display = 'block';
                layerOff.style.display = 'block';
            } else if (mode === 'working') {
                layerWork.style.display = 'block';
                layerWork.removeAttribute('opacity');
            } else if (mode === 'official') {
                layerOff.style.display = 'block';
            } else if (mode === 'proposal') {
                // Fyzický + Oficiální + Návrh kójí 885/4 a 885/5
                layerWork.style.display = 'block';
                layerOff.style.display = 'block';
                layerProp.style.display = 'block';
                layerWork.removeAttribute('opacity');
                selectItem('proposal', 'Cílový stav', 'Fyzický + Oficiální stav + Kóje 885/4, 885/5', 'Kompletní plán', 'Sloučený pohled pro realizaci');
            } else if (mode === 'proposal2') {
                // Fyzický + Oficiální + Návrh cílového stavu 2
                layerWork.style.display = 'block';
                layerOff.style.display = 'block';
                layerProp2.style.display = 'block';
                layerWork.removeAttribute('opacity');
                selectItem('proposal2', 'Cílový stav 2', 'Fyzický + Oficiální stav + Návrh 2', 'Kompletní plán', 'Alternativní návrh vycházející z Návrhu cílového stavu');
            } else if (mode === 'usage') {
                layerWork.style.display = 'block';
                layerUsage.style.display = 'block';
                layerWork.removeAttribute('opacity');
            } else if (mode === 'visualization') {
                layerWork.style.display = 'block';
                layerVis.style.display = 'block';
                layerWork.removeAttribute('opacity');
            } else if (mode === 'visualization2') {
                // Samostatný čistý půdorys cílového stavu dle Návrhu 2
                layerVis2.style.display = 'block';
                selectItem('vis2', 'Cílový stav 2', 'Vizualizace dle Návrhu cílového stavu 2', '10 soukromých kójí, 2 společné', 'Nové příčky 15 cm (37,3 m), dveře 0,80 m, rozměry vnitřní');
            } else if (mode === 'electric') {
                layerWork.style.display = 'block';
                layerOff.style.display = 'block';
                layerProp.style.display = 'block';
                layerElec.style.display = 'block';
                layerWork.removeAttribute('opacity');
                selectItem('elec', 'Elektroinstalace', 'Cílové zapojení IP44', 'Kompletní síť', 'Všechna světla a zásuvky (vč. kójí 885/4 a 885/5)');
            }
        }

        function toggleDimensions() {
            dimensionsVisible = !dimensionsVisible;
            const layerDim = document.getElementById('layer-dimensions');
            const btnDim = document.getElementById('btn-dim');

            if (dimensionsVisible) {
                layerDim.style.display = 'block';
                btnDim.classList.add('active');
                btnDim.innerText = '📐 Vrstva rozměrů (Zapnuta)';
            } else {
                layerDim.style.display = 'none';
                btnDim.classList.remove('active');
                btnDim.innerText = '📐 Vrstva rozměrů (Vypnuta)';
            }
        }

        function selectItem(type, id, name, dim, use) {
            const panel = document.getElementById('panel-body');
            let badgeClass = 'badge-working';
            let badgeText = 'Fyzické zaměření';
            let colorHex = '#1565c0';

            if (type === 'official') {
                badgeClass = 'badge-official';
                badgeText = 'Oficiální stav (PV)';
                colorHex = '#d84315';
            } else if (type === 'proposal') {
                badgeClass = 'badge-proposal';
                badgeText = 'Návrh cílového stavu';
                colorHex = '#0288d1';
            } else if (type === 'proposal2') {
                badgeClass = 'badge-proposal2';
                badgeText = 'Návrh cílového stavu 2';
                colorHex = '#00897b';
            } else if (type === 'usage') {
                badgeClass = 'badge-usage';
                badgeText = 'Aktuální uživatel';
                colorHex = '#7b1fa2';
            } else if (type === 'vis') {
                badgeClass = 'badge-vis';
                badgeText = 'Vizualizace kójí';
                colorHex = '#37474f';
            } else if (type === 'vis2') {
                badgeClass = 'badge-vis2';
                badgeText = 'Vizualizace kójí 2';
                colorHex = '#1565c0';
            } else if (type === 'elec') {
                badgeClass = 'badge-elec';
                badgeText = 'Elektroinstalace IP44';
                colorHex = '#f57c00';
            } else if (type === 'unusable') {
                badgeClass = 'badge-unusable';
                badgeText = 'Nevyužitelný prostor';
                colorHex = '#455a64';
            }

            panel.innerHTML = `
                <div style="margin-bottom: 12px;">
                    <span class="badge ${badgeClass}">${badgeText}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Označení:</span>
                    <span class="info-val" style="color: ${colorHex}; font-size: 18px; font-weight: bold;">${id}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Typ / Název:</span>
                    <span class="info-val">${name}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Přesný rozměr / Parametry:</span>
                    <span class="info-val" style="color:#2e7d32; font-weight:bold;">${dim}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Využití / Provedení:</span>
                    <span class="info-val">${use}</span>
                </div>
            `;
        }

        async function loadText() {
            const textBox = document.getElementById('joke-box');
            const textEl = document.getElementById('joke-text');

            try {
                const response = await fetch('/api/generate-text?_=' + Date.now());
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const text = await response.text();
                const trimmed = text.trim();
                if (!trimmed) {
                    throw new Error('Prázdná odpověď ze serveru');
                }

                textEl.textContent = trimmed;
            } catch (error) {
                console.warn('Nepodařilo se načíst text:', error);
                if (textBox) {
                    textBox.style.display = 'none';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', loadText);
    </script>
</body>
</html>
